<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "C:/xampp/htdocs"
</VirtualHost>

<VirtualHost *:80>
    ServerName sneakerpeak.localhost
    DocumentRoot "C:/xampp/htdocs/SneakerPeak/public"

    <Directory "C:/xampp/htdocs/SneakerPeak/public">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
